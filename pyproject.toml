[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agents"
version = "0.1.0"
description = "Coding agent applications/experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "httpx",
    "uvicorn",
    "starlette",
    "loguru",
    "tqdm",
    "psutil",
    "nvidia-ml-py",
    "vllm",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
coding-agents-trace-collection = "coding_agents.trace_collection.main:main"
coding-agents-isl-osl = "coding_agents.trace_collection.main:main"
coding-agents-replay = "coding_agents.replay.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_agents*"]
exclude = [
    "coding_agents.trace_collection.results*",
]
namespaces = true

[tool.setuptools.package-data]
coding_agents = ["server.sh"]
